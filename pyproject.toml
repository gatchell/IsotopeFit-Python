[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isotopefit"
version = "0.1.0.dev0"
description = "Python port of IsotopeFit: evaluation of mass spectra with a focus on cluster series"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.10"
authors = [
    { name = "Stefan Ralser" },
    { name = "Johannes Postler" },
    { name = "Martina Harnisch" },
    { name = "Michael Gatchell", email = "gatchell@fysik.su.se" },
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "h5py>=3.7",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5", "pyqtgraph>=0.13.3"]
dev = ["pytest>=7"]

[project.scripts]
isotopefit-gui = "isotopefit.gui.app:main"
isotopefit-batch = "isotopefit.batch:main"

[tool.hatch.build.targets.wheel]
packages = ["src/isotopefit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
