# Runs the tests and builds the Windows program and the macOS app on GitHub's machines.
# - Every push and pull request: the builds can be downloaded from the run's page
#   (Actions tab -> the run -> Artifacts).
# - Pushing a tag such as v0.1.0: the builds are also attached to a GitHub release.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to attach the builds to a release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen  # GUI tests without a screen
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,dev]" "pyinstaller>=6.16" pyinstaller-hooks-contrib pillow

      - name: Test
        run: python -m pytest -q

      - name: Build the Windows program
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/pyinstaller packaging/IsotopeFit.spec
          Compress-Archive -Path dist/IsotopeFit -DestinationPath IsotopeFit-windows.zip

      - name: Build the macOS app
        if: runner.os == 'macOS'
        run: |
          PYTHON=python bash packaging/build_mac.sh
          ditto -c -k --keepParent dist/IsotopeFit.app IsotopeFit-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: IsotopeFit-${{ runner.os }}
          path: IsotopeFit-*.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: IsotopeFit-*.zip
